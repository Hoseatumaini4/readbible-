<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bible Hours</title>
<meta name="theme-color" content="#0D5C69">
<meta name="description" content="An hourly Bible reading tracker, 6 AM to 9 PM, with GPS day map. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">Bible Hours <small>6 AM to 9 PM</small></div>
    <div id="pills" aria-live="polite"></div>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Pages"></nav>
  <main>
    <section id="v-now" class="view" aria-label="Now"></section>
    <section id="v-review" class="view" aria-label="Review" hidden></section>
    <section id="v-map" class="view" aria-label="Map" hidden></section>
    <section id="v-more" class="view" aria-label="More" hidden></section>
  </main>
</div>
<datalist id="places"></datalist>
<datalist id="songs"></datalist>
<noscript>Bible Hours needs JavaScript.</noscript>
<script src="lib/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
